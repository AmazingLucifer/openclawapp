name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install pkg for server packaging
        run: npm install -g pkg

      - name: Install server dependencies
        run: |
          cd server
          npm install

      - name: Build server.exe (standalone)
        run: |
          cd server
	  ren package-cjs.js package-cjs.cjs
          node package-cjs.cjs
          pkg index.cjs --targets node18-win-x64 --output ./server.exe

      - name: Build Vue frontend
        run: npm run build:web

      - name: Build Windows installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Setup
          path: dist/*.exe
          retention-days: 30

      - name: Upload unpacked dir
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-unpacked
          path: dist/win-unpacked/
          retention-days: 7
